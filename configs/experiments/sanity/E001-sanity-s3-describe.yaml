# S3 free-text description of one image (synthetic + LIDC calibration). Verbatim, no scoring.
id: E001-sanity-s3-describe
test: description
title: Free-text description of a single image
description: >-
  One image per request with a neutral caption ("attached image"), so the text does not
  reveal modality, window or level. Synthetic phantom with and without a 30 mm nodule, and
  three lung levels (15 / 50 / 85 % of the lung extent) of one nodule-positive and one
  negative calibration LIDC study. Answers are recorded verbatim for review; no score.
vision_ref: "Vision §10, §11, §24: visual-understanding readiness diagnostic"
phases: [calibration]
models: [medgemma1.5-q4, medgemma1.5-q8, qwen3-vl-4b-nothink]
question:
  kind: free_text
  text: >-
    Describe IMAGE 1 briefly. State (1) the imaging modality and plane, (2) the body
    region, (3) the display window or contrast setting, (4) which side of the image shows
    the patient's right side, (5) the anatomical level, and (6) anything abnormal.
  num_predict: 400
windows: [lung, medgemma]
layouts: [single]
image_mode: single
n_images: 1
size: 896
slab_mm: 5.0
num_ctx: 4096
top_logprobs: 0
neutral_captions: true
seed: 0
synthetic:
  phantoms:
    - {seed: 0, side: right, diameter_mm: 30}
    - {seed: 0, side: right, diameter_mm: 0}
lidc:
  positive_studies: 1
  negative_studies: 1
  levels: [0.15, 0.5, 0.85]
