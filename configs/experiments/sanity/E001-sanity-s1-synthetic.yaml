# S1 image dependence on synthetic phantoms (no patient data). Diagnostic, not accuracy.
# num_ctx 12288: qwen3-vl encodes an 896 px image as ~1030 tokens, so 8 images exceed 8192.
id: E001-sanity-s1-synthetic
test: image_dependence
title: Image dependence on synthetic phantoms (real / grey / noise / shuffled / none)
description: >-
  Same multi-image yes/no nodule question with the E001-schema image path (lung_extent,
  5 mm view MIP, 896 px, MedGemma RGB, image-only captions, no cues), uniform grey images,
  noise, a shuffled image order and no images. Identical answers and P(yes) for real,
  grey and noise mean the image path is broken or ignored. Single-message and
  one-message-per-image layouts.
vision_ref: "Vision §10, §11, §24: input-path readiness diagnostic"
phases: [calibration]
models: [medgemma1.5-q4, medgemma1.5-q8, qwen3-vl-4b-nothink]
question:
  kind: yes_no
  system: >-
    You are assisting a research benchmark of thoracic CT reading. Your output is an
    experimental research prediction, not medical advice.
  text: >-
    Is there a pulmonary nodule in any of the $n_images images? Answer with JSON
    {"nodule": "yes" or "no", "confidence": probability between 0 and 1 that your answer
    is correct}.
  num_predict: 32
windows: [medgemma]
layouts: [single, interleaved]
conditions: [real, gray, noise, shuffled, none]
image_mode: multi
n_images: 8
size: 896
slab_mm: 5.0
num_ctx: 12288
top_logprobs: 10
seed: 0
synthetic:
  phantoms:
    - {seed: 0, side: right, diameter_mm: 30}
    - {seed: 0, side: right, diameter_mm: 0}
